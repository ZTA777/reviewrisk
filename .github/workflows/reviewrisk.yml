name: ReviewRisk
on:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Scan pull-request diff
        shell: bash
        run: |
          set +e
          reviewrisk --git-diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" --format markdown --fail-on high | tee reviewrisk-report.md
          status=${PIPESTATUS[0]}
          cat reviewrisk-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
